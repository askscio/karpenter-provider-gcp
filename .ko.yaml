# Pin the controller base image so its CA bundle is deterministic. Without this, ko
# uses cgr.dev/chainguard/static:latest as of build time, which froze a
# ca-certificates-bundle (20260611-r1) that still trusts eMudhra's compromised
# emSign ECC Root CA - G3, emSign ECC Root CA - C3 and emSign Root CA - C1.
# This digest ships ca-certificates-bundle 20261020-r0 (only emSign Root CA - G1,
# which is unaffected, remains). Bump deliberately; do not switch back to :latest.
defaultBaseImage: cgr.dev/chainguard/static@sha256:fc42af33e643f20d08baf03cddcc1c02ba57052dfb02edb0d79f3fc47bcea8d9
defaultPlatforms:
  - linux/arm64
  - linux/amd64
